{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="login">
  {% include "_particles.svg" %}
  <form class="card" method="post" action="/ui/login">
    <span class="wordmark">{% include "_wordmark.html" %}</span>
    <h1>Sign in</h1>
    {% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
    <input type="text" name="username" value="operator" autocomplete="username" hidden>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <label for="code">Authenticator code</label>
    <input id="code" class="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
    {% if next != "/ui/" %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="primary" type="submit">Sign in</button>
  </form>
</main>
{% endblock %}
