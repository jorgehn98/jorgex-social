name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste** tokens, app secrets, passwords, screenshots or copies of conversations,
        comments or messages, or other people's usernames or ids. Issues are public.

        The project serves one Instagram professional account per installation and never stores the
        text of comments or messages; requests against that design are unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Mention any Meta API limits you know apply.
    validations:
      required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no tokens, secrets, conversation screenshots or other people's identifiers.
          required: true
