name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra mcp
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the image without pushing it and starts the stack in simulation, so neither the
      # Dockerfile nor compose.yaml can rot.
      - run: cp .env.example .env
      - run: docker compose build --pull
      # The worker has no healthcheck, so wait on the API only; then make sure the worker stays up
      # and stops promptly on SIGTERM.
      - run: docker compose up -d --wait --wait-timeout 180 api && docker compose up -d worker
      - run: curl -fsS http://127.0.0.1:8000/health
      - run: test -n "$(docker compose ps --status running --quiet worker)"
      - run: timeout 60 docker compose stop worker && docker compose logs worker | grep -q "worker stopped"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v --timeout 30
