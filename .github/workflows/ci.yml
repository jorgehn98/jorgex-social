name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Audits exactly the locked versions (runtime and dev), with their hashes,
      # without letting pip resolve anything.
      - run: >-
          uv export --frozen --all-groups --no-emit-project
          --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not only the tip
      # gitleaks v8.30.1, pinned by digest. .gitleaks.toml only allows the documented placeholder token.
      - run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the image without pushing it and starts the stack in simulation, so neither the
      # Dockerfile nor compose.yaml can rot.
      - run: cp .env.example .env
      - run: docker compose build --pull
      # The worker has no healthcheck, so wait on the API only; then make sure the worker stays up
      # and stops promptly on SIGTERM.
      - run: docker compose up -d --wait --wait-timeout 180 api && docker compose up -d worker
      - run: curl -fsS http://127.0.0.1:8000/health
      - run: test -n "$(docker compose ps --status running --quiet worker)"
      # Stop it only once it is running its loop: a SIGTERM during start-up simply ends the
      # process (nothing to finish yet), which would not exercise the graceful shutdown.
      - run: |
          for _ in $(seq 60); do docker compose logs worker | grep -q "worker started" && break; sleep 1; done
          timeout 60 docker compose stop worker
          docker compose logs worker | grep -q "worker stopped"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v --timeout 30
