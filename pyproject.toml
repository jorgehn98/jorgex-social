[project]
name = "jorgex-social"
version = "0.1.0"
description = "Self-hosted, agent-first scheduling, publishing, insights and rule-based replies for one Instagram professional account."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pyotp>=2.10.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
jorgex-social = "jorgex_social.cli:main"
jorgex-social-mcp = "jorgex_social_mcp.server:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The MCP client ships in the same distribution; its `mcp` dependency is the `mcp` extra.
module-name = ["jorgex_social", "jorgex_social_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/jorgex_social/migrations/versions/*" = ["F401"]
